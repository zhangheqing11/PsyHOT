# Optional private WeRSS sidecar. Start together with docker-compose.yml and --profile werss.
services:
  werss:
    image: ghcr.io/rachelos/we-mp-rss@sha256:af771f21b3f7958a5dea16911fba050a6d7b92eac2fb2499c467c1b11f07ef34
    profiles: [werss]
    restart: unless-stopped
    env_file: .data/werss/runtime.env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./.data/werss/data:/app/data
      - ./deploy/werss/start.sh:/app/psyhot/start.sh:ro
      - ./deploy/werss/run.py:/app/psyhot/run.py:ro
      - ./deploy/werss/auth_adapter.py:/app/psyhot/auth_adapter.py:ro
      - ./deploy/werss/async_collect.py:/app/psyhot/async_collect.py:ro
      - ./deploy/werss/verified_weread.py:/app/psyhot/verified_weread.py:ro
      - ./deploy/werss/weread_session.py:/app/psyhot/weread_session.py:ro
      - ./deploy/werss/web_collector.py:/app/core/wx/model/web.py:ro
      - ./industry/wechat-werss.json:/app/psyhot/accounts.json:ro
    command: ["/bin/bash", "/app/psyhot/start.sh"]
    shm_size: 256mb
    stop_grace_period: 30s
